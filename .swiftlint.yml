# SwiftLint Configuration for PlaceholderUITextView

# Paths to include during linting. `--path` is ignored if present.
included:
  - Source
  - Example/iOS Example

# Paths to ignore during linting. Overrides `included`.
excluded:
  - Carthage
  - Pods
  - .build
  - .swiftpm

# Rules to disable
disabled_rules:
  - trailing_whitespace # Handled by editor
  - unused_optional_binding # Can be useful for debugging

# Rules to enable (opt-in)
opt_in_rules:
  - array_init
  - attributes
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - conditional_returns_on_newline
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - explicit_init
  - extension_access_modifier
  - fallthrough
  - fatal_error_message
  - file_header
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - nimble_operator
  - nslocalizedstring_key
  - number_separator
  - object_literal
  - operator_usage_whitespace
  - overridden_super_call
  - override_in_extension
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - prohibited_super_call
  - quick_discouraged_call
  - quick_discouraged_focused_test
  - quick_discouraged_pending_test
  - reduce_into
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - static_operator
  - strong_iboutlet
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - xct_specific_matcher
  - yoda_condition

# Rule configurations
type_body_length:
  - 300 # warning
  - 400 # error

function_body_length:
  - 40  # warning
  - 100 # error

line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_function_declarations: true
  ignores_comments: true

cyclomatic_complexity:
  warning: 10
  error: 15

file_length:
  warning: 500
  error: 1000

identifier_name:
  min_length: 2
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - URL
    - x
    - y

nesting:
  type_level:
    warning: 3
    error: 6
  statement_level:
    warning: 5
    error: 10

# Custom rules
custom_rules:
  # Ensure proper spacing around operators
  spaces_around_operators:
    name: "Spaces Around Operators"
    regex: '[a-zA-Z0-9]\+[a-zA-Z0-9]'
    match_kinds:
      - argument
      - attribute.builtin
      - attribute.name
      - buildconfig.id
      - buildconfig.keyword
      - identifier
      - keyword
      - number
      - objectliteral
      - parameter
      - placeholder
      - string
      - string_interpolation_anchor
      - typeidentifier
    message: "Operators should be surrounded by spaces"
    severity: warning

  # Discourage force unwrapping
  force_unwrapping:
    name: "Force Unwrapping"
    regex: '!\s*(?:[^=\n]|$)'
    match_kinds:
      - identifier
      - keyword
    message: "Avoid force unwrapping. Use optional binding or nil coalescing instead."
    severity: warning

# Reporter type
reporter: "xcode"

# File header rule
file_header:
  required_pattern: |
                    \/\/
                    \/\/  .*?\.swift
                    \/\/  PlaceholderUITextView
                    \/\/
                    \/\/  Created by .* on \d+\/\d+\/\d+\.
                    \/\/  Copyright © \d+ .* All rights reserved\.
                    \/\/