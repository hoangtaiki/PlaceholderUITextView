name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SwiftLint
        uses: norio-nomura/action-swiftlint@3.2.1
        with:
          args: --strict

  test-ios:
    name: Test iOS
    runs-on: macos-14
    strategy:
      matrix:
        destination:
          - "platform=iOS Simulator,OS=18.2,name=iPhone 16"
          - "platform=iOS Simulator,OS=17.5,name=iPhone 15"
          
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache derived data
        uses: actions/cache@v3
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-derived-data-${{ hashFiles('**/*.xcodeproj') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-

      - name: Build and Test
        run: |
          xcodebuild clean test \
            -scheme PlaceholderUITextView \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false

  test-spm:
    name: Test Swift Package Manager
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Package Manager Build
        run: swift build

      - name: Swift Package Manager Test
        run: swift test

  test-cocoapods:
    name: Test CocoaPods Integration
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0
          bundler-cache: true

      - name: Install CocoaPods
        run: gem install cocoapods

      - name: Pod lib lint
        run: pod lib lint --swift-version=5.0

  example-project:
    name: Build Example Project
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache derived data
        uses: actions/cache@v3
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-example-derived-data-${{ hashFiles('Example/**/*.xcodeproj') }}
          restore-keys: |
            ${{ runner.os }}-example-derived-data-

      - name: Build Example
        working-directory: ./Example
        run: |
          xcodebuild clean build \
            -workspace 'iOS Example.xcworkspace' \
            -scheme 'iOS Example' \
            -destination 'platform=iOS Simulator,OS=16.4,name=iPhone 14' \
            -destination 'platform=iOS Simulator,OS=15.6,name=iPhone 13' \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

  documentation:
    name: Documentation
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Swift-DocC-Render
        run: |
          npm install -g @apple/swift-docc-render

      - name: Generate Documentation
        run: |
          swift package generate-documentation --target PlaceholderUITextView

      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: .build/plugins/Swift-DocC/outputs/PlaceholderUITextView.doccarchive
